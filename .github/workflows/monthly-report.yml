name: Monthly report

on:
  schedule:
    - cron: '17 6 24 * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional YYYY-MM-24 date; leave blank for the latest monthly publication date in Amsterdam
        required: false
        type: string
      dry_run:
        description: Build and upload the report and evidence without committing or deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Test monthly pipeline without API calls
        run: npm run monthly:test
      - name: Set publication mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$DRY_RUN" == "false" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and validate evidence run
        id: run
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run report:generate
      - name: Prepare validated report and evidence; build site
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: npm run pipeline:publish -- --run-id="$RUN_ID"
      - name: Validate report compatibility
        env:
          REPORT_DATE: ${{ steps.run.outputs.report_date }}
        run: npm run report:validate -- --report-date="$REPORT_DATE"
      - name: Upload run evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.mode.outputs.publish == 'true' && 'monthly-report-evidence' || 'monthly-report-dry-run' }}
          if-no-files-found: warn
          path: |
            data/runs/
            src/data/reports/*.md
      - name: Commit report and evidence together
        if: steps.mode.outputs.publish == 'true'
        env:
          REPORT_DATE: ${{ steps.run.outputs.report_date }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "src/data/reports/${REPORT_DATE}.md" "data/evidence/report-${REPORT_DATE}"
          if git diff --cached --quiet; then
            echo "Report and evidence already match the generated output."
          else
            git commit -m "publish monthly industry report and evidence"
            git push
          fi
      - name: Configure Pages
        if: steps.mode.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: needs.generate.outputs.publish == 'true'
    needs: generate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
